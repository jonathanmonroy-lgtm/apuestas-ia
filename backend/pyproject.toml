[project]
name = "apuestas-ia-backend"
version = "0.1.0"
description = "API e ingesta de datos de Apuestas IA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "respx>=0.21",
]

[tool.uv]
# Supply chain: ignore packages published in the last ~2 weeks.
exclude-newer = "2026-09-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text in strings/comments

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["E501"]
