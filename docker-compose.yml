services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apuestas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apuestas_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-apuestas}
    ports:
      - "127.0.0.1:5432:5432"  # local only, never exposed on the network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apuestas}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
